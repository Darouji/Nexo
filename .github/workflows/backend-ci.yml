name: NEXO CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  backend:
    name: Django backend checks
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    env:
      DJANGO_SECRET_KEY: ci-only-secret-key-for-nexo-v2
      DJANGO_DEBUG: "True"
      DJANGO_ENABLE_API_DOCS: "True"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      DJANGO_CORS_ALLOWED_ORIGINS: http://localhost:5173
      DJANGO_CSRF_TRUSTED_ORIGINS: http://localhost:5173
      DJANGO_LANGUAGE_CODE: es-cl
      DJANGO_TIME_ZONE: America/Santiago
      DB_ENGINE: sqlite
      DB_NAME: ci.sqlite3
      DRF_TOKEN_EXPIRE_HOURS: "12"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Python dependencies
        run: pip check

      - name: Check Django configuration
        run: python manage.py check

      - name: Check pending migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Run backend tests
        run: python manage.py test

      - name: Validate OpenAPI schema
        run: python manage.py spectacular --file schema.yml --validate

      - name: Check static files collection
        run: python manage.py collectstatic --noinput --dry-run

  frontend:
    name: React frontend checks
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Test frontend
        run: npm test

      - name: Build frontend
        run: npm run build
